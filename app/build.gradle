plugins {
    id 'com.android.application'
}

android {
    namespace 'com.davidik.files'
    compileSdk 35

    defaultConfig {
        applicationId 'com.davidik.files'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.github.junrar:junrar:8.1.2'
}
